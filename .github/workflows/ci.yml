name: Node tests and static build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Model and gameplay logic tests
        run: npm test
      - name: Production static build
        run: npm run build
      - name: Verify production entry point
        run: node -e "const fs = require('node:fs'); if (!fs.existsSync('dist/index.html')) process.exit(1);"
